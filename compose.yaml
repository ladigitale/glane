# Glane monorepo — API (FrankenPHP) + PostgreSQL (same family as Tadaaa)
services:
  php:
    image: ${IMAGES_PREFIX:-}glane-api
    build:
      context: ./apps/api
      target: frankenphp_dev
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80, glane-mercure:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-8444}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-glane}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      APP_SECRET: ${APP_SECRET:-ChangeMeToARandomSecretKey32chars}
      APP_NAME: ${APP_NAME:-Glane}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$}
      MERCURE_ENABLED: ${MERCURE_ENABLED:-0}
      MERCURE_URL: ${MERCURE_URL:-http://127.0.0.1/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://localhost:8444/.well-known/mercure}
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      APP_LISTEN_DIR: ${APP_LISTEN_DIR:-/app/var/listens}
      FRONT_URL: ${FRONT_URL:-http://localhost:5173}
    volumes:
      - ./apps/api:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - target: 80
        published: ${HTTP_PORT:-8081}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-8444}
        protocol: tcp
    networks:
      default:
      supersoniks:
        aliases:
          - glane-mercure
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-glane}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

networks:
  supersoniks:
    external: true
    # Override locally via compose.override.yaml (external: false) if needed.

volumes:
  caddy_data:
  caddy_config:
  database_data:
