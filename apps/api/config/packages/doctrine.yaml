doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        # PHP 8.4 — avoid Symfony LazyGhost / var-exporter for entity proxies
        enable_native_lazy_objects: true
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
