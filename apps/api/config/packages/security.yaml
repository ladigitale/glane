security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        register:
            pattern: ^/api/auth/register
            security: false
        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

when@dev:
    security:
        access_control:
            - { path: ^/api/health, roles: PUBLIC_ACCESS }
            - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
            - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
            - { path: ^/api/publish/soundcloud/callback, roles: PUBLIC_ACCESS }
            - { path: ^/api/listens/[^/]+$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
            - { path: ^/api/listens/[^/]+/audio$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
            - { path: ^/api/docs, roles: PUBLIC_ACCESS }
            - { path: ^/api, roles: PUBLIC_ACCESS }

when@prod:
    security:
        access_control:
            - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
            - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
            - { path: ^/api/publish/soundcloud/callback, roles: PUBLIC_ACCESS }
            - { path: ^/api/listens/[^/]+$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
            - { path: ^/api/listens/[^/]+/audio$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
            - { path: ^/api/health, roles: PUBLIC_ACCESS }
            - { path: ^/api/docs, roles: PUBLIC_ACCESS }
            - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
